		<!-- InstanceBeginEditable name="main" -->
		<div class="container">
			<h1 class="page-header">单选和多选</h1>
			<form class="form">
				<div class="form-group">
					<label class="form-label">多选</label>
					<div class="checkbox-group">
						<label><div class="checkbox"><input type="checkbox"></div>默认状态</label>
						<label><div class="checkbox checkbox-checked"><input type="checkbox"></div>选中</label>
						<label><div class="checkbox checkbox-indeterminate"><input type="checkbox"></div>部分选中</label>
					</div>
				</div>
				<div class="form-group">
					<label class="form-label">多选水平布局</label>
					<div class="checkbox-group-horizontal">
						<label><div class="checkbox"><input type="checkbox"></div>默认状态</label>
						<label><div class="checkbox checkbox-checked"><input type="checkbox"></div>选中</label>
						<label><div class="checkbox checkbox-indeterminate"><input type="checkbox"></div>部分选中</label>
					</div>
				</div>
				<div class="form-group">
					<label class="form-label">多选置灰</label>
					<div class="checkbox-group-horizontal">
						<label><div class="checkbox checkbox-disabled"><input type="checkbox" disabled></div>默认状态</label>
						<label><div class="checkbox checkbox-checked checkbox-disabled"><input type="checkbox" disabled></div>选中</label>
						<label><div class="checkbox checkbox-indeterminate checkbox-disabled"><input type="checkbox" disabled></div>部分选中</label>
					</div>
				</div>
				<div class="form-group">
					<label class="form-label">多选校验</label>
					<div class="checkbox-group-horizontal has-invalid">
						<label><div class="checkbox"><input type="checkbox"></div>默认状态</label>
						<label><div class="checkbox checkbox-checked"><input type="checkbox"></div>选中</label>
						<label><div class="checkbox checkbox-indeterminate"><input type="checkbox"></div>部分选中</label>
						<label><div class="checkbox checkbox-disabled"><input type="checkbox" disabled></div>默认状态</label>
						<label><div class="checkbox checkbox-checked checkbox-disabled"><input type="checkbox" disabled></div>选中</label>
						<label><div class="checkbox checkbox-indeterminate checkbox-disabled"><input type="checkbox" disabled></div>部分选中</label>
					</div>
				</div>
				<div class="form-group">
					<label class="form-label">单选</label>
					<div class="radio-group">
						<label><div class="radio"><input type="radio" name="radio"></div>默认状态</label>
						<label><div class="radio radio-checked"><input type="radio" name="radio"></div>选中</label>
					</div>
				</div>
				<div class="form-group">
					<label class="form-label">水平布局单选</label>
					<div class="radio-group-horizontal">
						<label><div class="radio"><input type="radio" name="radio"></div>默认状态</label>
						<label><div class="radio radio-checked"><input type="radio" name="radio"></div>选中</label>
					</div>
				</div>
				<div class="form-group">
					<label class="form-label">单选置灰</label>
					<div class="radio-group-horizontal">
						<label><div class="radio radio-disabled"><input type="radio" name="radio" disabled></div>默认状态</label>
						<label><div class="radio radio-checked radio-disabled"><input type="radio" name="radio" disabled></div>选中</label>
					</div>
				</div>
				<div class="form-group">
					<label class="form-label">单选校验</label>
					<div class="radio-group-horizontal has-invalid">
						<label><div class="radio"><input type="radio" name="radio"></div>默认状态</label>
						<label><div class="radio radio-checked"><input type="radio" name="radio"></div>选中</label>
						<label><div class="radio radio-disabled"><input type="radio" name="radio" disabled></div>默认状态</label>
						<label><div class="radio radio-checked radio-disabled"><input type="radio" name="radio" disabled></div>选中</label>
					</div>
				</div>
			</form>
		</div>
